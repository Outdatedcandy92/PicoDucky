<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Under construction</title>
  <style>
    @font-face {
      font-family: 'Dreamer';
      src: url('./dreamer.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      color: #0d3dff;
      background: #f7f3ea;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      background: #f7f3ea;
      color: #0d3dff;
      font-family: 'Dreamer', serif;
    }

    .message {
      font-size: clamp(2.5rem, 8vw, 7rem);
      line-height: 1;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="message">Under Construction</div>
</body>
</html>
